[project]
name = "finagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.139.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.4.0",
    "testcontainers[postgres]>=4.8.0",
    "pytest-asyncio>=1.4.0",
    "yfinance>=1.6.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "openai>=2.53.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
asyncio_mode = "auto"

[tool.mypy]
plugins = ["sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "app.core.config"
ignore_errors = true
