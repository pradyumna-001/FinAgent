name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy app

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://finagent:${POSTGRES_PASSWORD:-finagent_secure_pass}@localhost:5432/finagent
          MIGRATION_DATABASE_URL: postgresql+psycopg://finagent:${POSTGRES_PASSWORD:-finagent_secure_pass}@localhost:5432/finagent
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
          NVIDIA_MODEL: openai/gpt-oss-20b
          NVIDIA_FALLBACK_MODEL: openai/gpt-oss-20b
          NVIDIA_NEMOTRON_MODEL: nvidia/nemotron-3-ultra

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run agent integration tests
        run: uv run pytest tests/integration/test_agents.py -v
        env:
          DATABASE_URL: postgresql+asyncpg://placeholder@localhost:5432/placeholder
          MIGRATION_DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
          NVIDIA_MODEL: openai/gpt-oss-20b
          NVIDIA_FALLBACK_MODEL: openai/gpt-oss-20b
          NVIDIA_NEMOTRON_MODEL: nvidia/nemotron-3-ultra