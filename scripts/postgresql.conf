# PostgreSQL Configuration File
# Custom configuration for FinAgent

# Connection settings
listen_addresses = '*'
port = 5432

# Authentication - use custom pg_hba.conf location
hba_file = '/etc/postgresql/pg_hba.conf'

# Logging
log_destination = 'stderr'
logging_collector = off
log_statement = 'none'
log_min_duration_statement = -1

# Memory (adjust for container)
shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB

# Write-ahead logging
wal_level = replica
max_wal_senders = 10

# Query tuning
random_page_cost = 1.1
effective_io_concurrency = 200
log_connections = on
log_disconnections = on
log_hostname = on
